apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'kto.smarttour'
//      서명 정보
    signingConfigs {
        release {
            storeFile file('../keystore/Vienam.keystore')
            storePassword 'oniontech939'
            keyAlias 'mykey'
            keyPassword 'oniontech939'
        }
    }
    defaultConfig {
        applicationId "kto.smarttour"
        minSdkVersion 21
        //'NUUA202510 : 변경내용'
        // Android 15 SDK 설정
        compileSdk 35
        targetSdkVersion 35
        versionCode 109
        versionName "4.3.6"
        buildConfigField("String", "SIGN_ACCESS_KEY", sign_access_key)
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-commons.pro'
            proguardFile 'proguard-firebase.pro'
            proguardFile 'proguard-rules.pro'
            proguardFile 'proguard-stg.pro'
            signingConfig signingConfigs.release

            String releaseUrl = "\"https://www.odii.kr\""//운영서버 (내재화 ssl 2022.07월부터 앱에서 사용)
            buildConfigField("String", "BASE_URL", releaseUrl)
        }
        debug {
            minifyEnabled true
            shrinkResources false
            proguardFile getDefaultProguardFile('proguard-android-optimize.txt')
            proguardFile 'proguard-commons.pro'
            proguardFile 'proguard-firebase.pro'
            proguardFile 'proguard-rules.pro'
            proguardFile 'proguard-stg.pro'
            firebaseCrashlytics {
                mappingFileUploadEnabled false
            }

            Properties localProperties = new Properties()
            File file = rootProject.file("local.properties")
            if (file.exists()) {
                FileInputStream inputStream = new FileInputStream(file)
                localProperties.load(inputStream)
                inputStream.close()
            }
            String debugUrl = localProperties.getProperty("BASE_URL_LOCAL")
                    ?: "\"http://121.131.208.44:18080\"" //엔티콘 개발 서버
            buildConfigField("String", "BASE_URL", debugUrl)
        }
    }


    buildFeatures {
        dataBinding true
        //'NUUA202510 : 변경내용'
        // Build Type contains custom BuildConfig fields, but the feature is disabled
        // 참고 자료: https://android.googlesource.com/platform/tools/base/+/370c706fb6553dc5952e10323a81f2b195405c3f%5E%21/
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.md', 'META-INF/LICENSE.txt', 'META-INF/license.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.md', 'META-INF/NOTICE.txt', 'META-INF/INDEX.LIST', 'META-INF/notice.txt', 'META-INF/ASL2.0']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
dependencies {
    implementation 'androidx.annotation:annotation:1.9.1'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'

    implementation 'com.google.android.material:material:1.13.0'

    // activity 1.10.1 이후 버전은 targetSdk가 36 이상부터
    //noinspection GradleDependency
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.fragment:fragment:1.8.9'

    implementation 'com.google.code.gson:gson:2.13.2'

    implementation 'com.google.android.gms:play-services-location:21.3.0'

    implementation 'com.google.firebase:firebase-core:21.1.1'
    //firebase-messaging 23.4.1 이후 버전은 minSdk 23
    //noinspection GradleDependency
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
    //firebase-analytics 18.6.1 이후 버전은 minSdk 23
    //noinspection GradleDependency
    implementation 'com.google.firebase:firebase-analytics:18.6.1'
    //firebase-crashlytics 18.6.1 이후 버전은 minSdk 23
    //noinspection GradleDependency
    implementation 'com.google.firebase:firebase-crashlytics:18.6.1'

    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.retrofit2:adapter-rxjava2:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

    implementation 'com.naver.maps:map-sdk:3.19.1'

    implementation 'com.github.bumptech.glide:glide:5.0.5'
    implementation files('libs/klog.jar')
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'

    implementation 'com.github.Triggertrap:SeekArc:v1.1'
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.chthai64:SwipeRevealLayout:1.4.0'
    implementation 'com.github.nguyenhoanglam:ImagePicker:1.4.3'
    implementation 'com.github.amitshekhariitbhu:PRDownloader:1.0.2'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation("com.github.mkaflowski:HybridMediaPlayer:1.9.4") {
        exclude group: 'com.github.zhaokaiqiang.klog', module: 'library'

    }
    implementation 'com.makeramen:roundedimageview:2.3.0'
//    implementation 'com.github.thang2162:Android-ScalableVideoView:v1.1.1'

    implementation 'com.scottyab:rootbeer-lib:0.1.1'
    implementation group: 'org.apache.commons', name: 'commons-text', version: '1.15.0'
    implementation "jakarta.xml.bind:jakarta.xml.bind-api:4.0.5"
    implementation "org.glassfish.jaxb:jaxb-runtime:4.0.7"

    implementation "com.getbase:floatingactionbutton:1.10.1"

    //lifecycle-viewmodel 2.6.2 이후 버전은 minSdk 23
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.6.2"
    //firebase-crashlytics 2.6.2 이후 버전은 minSdk 23
    //noinspection GradleDependency
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.6.2"

}

